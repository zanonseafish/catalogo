<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offerte della settimana • ZANON SEAFISH</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#fbfbf8; --ink:#111; --muted:#606060; --line:#e7e4dc; --brand:#0b5; --price:#0a6a2b; --danger:#ff2965; --pulse:#ffe000; }
    *{box-sizing:border-box} body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
    header{background:linear-gradient(180deg,#0b1620 0%, #0e1f2a 70%, #0e1f2a00 100%);color:#fff;padding:20px 12px 18px;text-align:center}
    .logo{height:60px;width:auto;display:block;margin:0 auto}
    h1{font-family:"Playfair Display",serif;font-weight:600;letter-spacing:.02em;margin:6px 0 2px 0;font-size:24px}
    .sub{opacity:.9;font-size:12px;margin:2px 0 0}
    .container{max-width:1000px;margin:10px auto 18px;padding:0 10px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px} @media (max-width:720px){ .grid{grid-template-columns:1fr} }
    .item{position:relative; display:grid; grid-template-columns:120px 1fr; gap:14px; align-items:center; background:#fff; border:2px solid var(--line); border-radius:16px; padding:12px; box-shadow:0 8px 24px rgba(0,0,0,.08); cursor:pointer;}
    .thumb{position:relative;width:120px;height:120px;border-radius:12px;overflow:hidden;background:#f1f1ed;border:1px solid var(--line)}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .star-wrap{position:absolute; left:6px; top:6px; width:clamp(56px,11vw,88px); height:clamp(56px,11vw,88px); pointer-events:none}
    .star{position:absolute; inset:0; background:var(--danger); clip-path:polygon(50% 0%, 60% 18%, 80% 10%, 68% 28%, 90% 35%, 70% 40%, 76% 60%, 58% 50%, 50% 80%, 42% 50%, 24% 60%, 30% 40%, 10% 35%, 32% 28%, 20% 10%, 40% 18%); animation:pulse 1.5s ease-in-out infinite; filter: drop-shadow(0 6px 12px rgba(255,41,101,.35));}
    .star-text{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:clamp(12px,2.6vw,16px); color:#fff; line-height:1; padding:6px; letter-spacing:-0.2px; transform: translateY(2px);}
    @keyframes pulse{ 0%,100%{transform:scale(1); filter:brightness(1)} 50%{transform:scale(1.06); filter:brightness(1.4)} }
    .title{font-family:"Playfair Display",serif;font-weight:800;font-size:20px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.01em}
    .desc{color:var(--muted);font-size:12.5px;margin:0 0 8px} .priceWrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .old{font-size:14px;color:#888;text-decoration:line-through} .price{color:var(--price);font-weight:900;font-size:26px;line-height:1}
    .unit{font-size:12px;color:#2a2a2a} .save{font-weight:800; font-size:13px; color:#111; background:var(--pulse); padding:6px 10px; border-radius:999px; border:2px solid #111; box-shadow:0 0 0 3px rgba(255,224,0,.45); animation:pulse 1.2s infinite; display:inline-block; margin-top:6px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
    .modal.open{display:flex} .modal-content{background:#fff;border-radius:12px;max-width:820px;width:min(96vw,820px);padding:18px;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.35)}
    .m-title{font-family:"Playfair Display",serif;margin:0 0 8px} .badge-modal{position:absolute;top:10px;left:10px;width:clamp(64px,12vw,96px);height:clamp(64px,12vw,96px)}
    .back{position:fixed;left:14px;bottom:14px;z-index:1200} .back a{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:#0b5;color:#fff;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25)}
  </style>
</head>
<body>
  <header>
    <img class="logo" src="images/logo.png" alt="Zanon Seafish Ingros SRL" onerror="this.onerror=null;this.src='images/default1.jpg';">
    <h1>Offerte della settimana</h1>
    <div class="sub">dal – al</div>
  </header>

  <main class="container">
    <section class="grid" id="grid"></section>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="badge-modal">
        <div class="star"></div>
        <div id="starTextModal" class="star-text">-0%</div>
      </div>
      <h2 id="mTitle" class="m-title"></h2>
      <img id="mImg" alt="" style="max-width:100%;height:auto;display:block;border-radius:10px;border:1px solid #eee">
      <p id="mDesc" class="desc"></p>
      <p id="mPrice" class="price" style="margin-top:6px"></p>
      <div style="margin-top:10px">
        <button id="shareBtn" class="share-small">Condividi</button>
        <button id="closeBtn" class="close-btn">Chiudi</button>
      </div>
    </div>
  </div>

  <div class="back"><a href="index.html" title="Torna al menu">↩︎ Menu</a></div>

  

  <script>
  const PRODUCTS = [
    // ESEMPIO: scommenta e duplica per aggiungere articoli
     {id:"ID-UNICO", name:"Nome prodotto", price:7.20, oldPrice:8.00, unit:"€/kg", shortDesc:"Descrizione breve", images:["images/percorso-immagine.jpg"]}
  ];
  function fmtEUR(v){ return new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(v); }
  function sanitizeUnit(u){ if(!u) return ""; return u.replace('€','').trim()==="/kg" ? "/kg" : "€/kg"; }
  function discPercent(p){ if(!p.oldPrice || p.oldPrice<=0 || !p.price || p.price>=p.oldPrice) return 0; return Math.ceil(((p.oldPrice-p.price)/p.oldPrice)*100); }
  function starHTML(text){ return '<div class="star-wrap"><div class="star"></div><div class="star-text">'+text+'</div></div>'; }
  function rowTemplate(p){
    const unit = p.unit ? sanitizeUnit(p.unit) : (p.unit===""? "" : "");
    const save  = (p.oldPrice && p.oldPrice>p.price) ? (p.oldPrice - p.price) : 0;
    const perc  = discPercent(p);
    const label = perc>0 ? ('-'+perc+'%') : '';
    return `
      <article class="item" onclick='openModal(${JSON.stringify(p).replace(/"/g,"&quot;")})' id="${p.id}">
        <div class="thumb">
          ${label ? starHTML(label) : ''}
          <img loading="lazy" src="${(p.images&&p.images[0])||'images/default1.jpg'}" alt="${p.name}" onerror="this.onerror=null;this.src='images/default1.jpg';">
        </div>
        <div>
          <h2 class="title">${p.name||""}</h2>
          <p class="desc">${p.shortDesc||""}</p>
          <div class="priceWrap">
            ${p.oldPrice?`<div class="old">${fmtEUR(p.oldPrice)}${unit}</div>`:""}
            <div class="price">${fmtEUR(p.price||0)}${unit}</div>
            <span class="unit">IVA escl.</span>
          </div>
          ${save>0?`<div class="save">RISPARMIO ${fmtEUR(save)}</div>`:""}
        </div>
      </article>`;
  }
  function render(list=PRODUCTS){
    const grid=document.getElementById("grid");
    grid.innerHTML = list.length ? list.map(rowTemplate).join("") :
      `<div style="grid-column:1/-1;background:#fff;border:1px dashed #bbb;border-radius:12px;padding:14px;font-size:13px;color:#555">
        Nessun articolo in offerta. Aggiungi una riga in <code>PRODUCTS</code> come da esempio.
      </div>`;
  }
  const modal=document.getElementById("modal");
  const mTitle=document.getElementById("mTitle");
  const mImg=document.getElementById("mImg");
  const mDesc=document.getElementById("mDesc");
  const mPrice=document.getElementById("mPrice");
  const starTextModal=document.getElementById("starTextModal");
  const shareBtn=document.getElementById("shareBtn");
  const closeBtn=document.getElementById("closeBtn");
  let current=null;
  function openModal(prod){
    current=prod;
    const unit = prod.unit ? (prod.unit.includes("/kg")?" /kg":" €/kg") : "";
    mTitle.textContent=prod.name||"";
    mImg.src=(prod.images&&prod.images[0])||"images/default1.jpg";
    mImg.alt=prod.name||"";
    const old = prod.oldPrice ? `<span class="old" style="text-decoration:line-through;margin-right:8px">${fmtEUR(prod.oldPrice)}${unit}</span>` : "";
    mDesc.textContent=prod.shortDesc||"";
    mPrice.innerHTML = `${old} <strong style="font-size:22px">${fmtEUR(prod.price||0)}${unit}</strong>`;
    const perc = discPercent(prod);
    const label = perc>0 ? ('-'+perc+'%') : '';
    document.querySelector('.badge-modal').style.display = perc>0 ? '' : 'none';
    starTextModal.textContent = label || '-0%';
    modal.classList.add("open"); document.body.style.overflow="hidden";
  }
  function closeModal(){ modal.classList.remove("open"); document.body.style.overflow=""; }
  closeBtn.onclick=closeModal;
  modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
  window.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
  shareBtn.onclick=async ()=>{
    if(!current) return;
    const url = location.origin+location.pathname+"#"+encodeURIComponent(current.id||"");
    try{ if(navigator.share){ await navigator.share({title:current.name,text:url,url}); return; } }catch(e){}
    try{ await navigator.clipboard.writeText(url); }catch(e){}
  };
  render();
  </script>
</body>
</html>
