<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offerte della settimana • ZANON SEAFISH</title>

  <meta property="og:title" content="Offerte della settimana • ZANON SEAFISH">
  <meta property="og:description" content="Offerte aggiornate manualmente.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://zanonseafish.github.io/catalogo/images/og-cover1.jpg">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{ --bg:#fbfbf8; --ink:#111; --muted:#606060; --line:#e7e4dc; --brand:#0b5; --price:#0a6a2b; --danger:#ff2965; --pulse:#ffe000; }
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}

    header{background:linear-gradient(180deg,#0b1620 0%, #0e1f2a 70%, #0e1f2a00 100%);color:#fff;padding:20px 12px 18px;text-align:center}
    .logo{height:60px;width:auto;display:block;margin:0 auto}
    h1{font-family:"Playfair Display",serif;font-weight:600;letter-spacing:.02em;margin:6px 0 2px 0;font-size:24px}
    .sub{opacity:.9;font-size:12px;margin:2px 0 0}

    .container{max-width:1000px;margin:10px auto 18px;padding:0 10px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media (max-width:720px){ .grid{grid-template-columns:1fr} }

    .item{position:relative; display:grid; grid-template-columns:120px 1fr; gap:14px; align-items:center;
      background:#fff; border:2px solid var(--line); border-radius:16px; padding:12px;
      box-shadow:0 8px 24px rgba(0,0,0,.08); transition:transform .12s, box-shadow .12s, border-color .12s; cursor:pointer;}
    .item:hover{ transform:translateY(-2px); box-shadow:0 14px 30px rgba(0,0,0,.12); border-color:#d9d4c9; }

    .thumb{position:relative;width:120px;height:120px;border-radius:12px;overflow:hidden;background:#f1f1ed;border:1px solid var(--line)}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}

    /* Stella promozione a impulsi morbidi */
    .star-wrap{position:absolute; right:6px; top:6px; width:64px; height:64px; pointer-events:none}
    .star{position:absolute; inset:0; background:var(--danger);
      clip-path:polygon(
        50% 0%, 60% 18%, 80% 10%, 68% 28%,
        90% 35%, 70% 40%, 76% 60%, 58% 50%,
        50% 80%, 42% 50%, 24% 60%, 30% 40%,
        10% 35%, 32% 28%, 20% 10%, 40% 18%
      );
      animation:pulse 1.5s ease-in-out infinite;
      filter: drop-shadow(0 6px 12px rgba(255,41,101,.35));
    }
    .star-text{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:11px; color:#fff; text-align:center; line-height:1.05; padding:6px}
    @keyframes pulse{
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.06); filter: brightness(1.4); }
    }

    .title{font-family:"Playfair Display",serif;font-weight:800;font-size:20px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.01em}
    .desc{color:var(--muted);font-size:12.5px;margin:0 0 8px}
    .priceWrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .old{font-size:14px;color:#888;text-decoration:line-through}
    .price{color:var(--price);font-weight:900;font-size:26px;line-height:1}
    .unit{font-size:12px;color:#2a2a2a}
    .save{font-weight:800; font-size:13px; color:#111; background:var(--pulse);
      padding:6px 10px; border-radius:999px; border:2px solid #111; box-shadow:0 0 0 3px rgba(255,224,0,.45); animation:pulse 1.2s infinite; display:inline-block; margin-top:6px}

    /* Modal */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
    .modal.open{display:flex}
    .modal-content{background:#fff;border-radius:12px;max-width:820px;width:min(96vw,820px);padding:18px;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.35)}
    .m-title{font-family:"Playfair Display",serif;margin:0 0 8px}
    .badge-modal{position:absolute;top:10px;right:10px;width:74px;height:74px}
    .share-small{border:none;border-radius:18px;padding:8px 12px;font-size:.9rem;cursor:pointer;background:#111;color:#fff}
    .close-btn{border:none;border-radius:18px;padding:8px 12px;font-size:.9rem;cursor:pointer;background:#eee;color:#111;margin-left:8px}

    /* Footer */
    .site-footer{max-width:1000px;margin:18px auto 24px;padding:0 10px;color:#444;font-size:12px}
    .site-rule{border:none;height:1px;background:#e5e2da;margin:6px 0 10px}
    .site-footer-inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .footer-logo{height:20px;width:auto}

    /* Pulsante ritorno semplice */
    .back{position:fixed;left:14px;bottom:14px;z-index:1200}
    .back a{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:#0b5;color:#fff;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25)}

    @media print{
      @page{size:A4;margin:14mm 12mm}
      header{background:none!important;color:#000!important;border-bottom:1px solid #ddd!important;padding:0 0 6mm}
      .modal,.back{display:none!important}
    }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="images/logo.png" alt="Zanon Seafish Ingros SRL" onerror="this.onerror=null;this.src='images/default1.jpg';">
    <h1>Offerte della settimana</h1>
    <div class="sub">dal – al</div>
  </header>

  <main class="container">
    <section class="grid" id="grid"></section>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="badge-modal">
        <div class="star"></div>
        <div id="starTextModal" class="star-text">OFFERTA</div>
      </div>
      <h2 id="mTitle" class="m-title"></h2>
      <img id="mImg" alt="" style="max-width:100%;height:auto;display:block;border-radius:10px;border:1px solid #eee">
      <p id="mDesc" class="desc"></p>
      <p id="mPrice" class="price" style="margin-top:6px"></p>
      <div style="margin-top:10px">
        <button id="shareBtn" class="share-small">Condividi</button>
        <button id="closeBtn" class="close-btn">Chiudi</button>
      </div>
    </div>
  </div>

  <!-- Ritorno -->
  <div class="back"><a href="index.html" title="Torna al menu">↩︎ Menu</a></div>

  <footer class="site-footer">
    <hr class="site-rule">
    <div class="site-footer-inner">
      <img src="images/logo.png" alt="Zanon Seafish Ingros SRL" class="footer-logo" onerror="this.style.display='none'">
      <div>
        <strong>Zanon Seafish Ingros SRL</strong> · P.IVA IT01654690278 ·
        Via Colombara 115/A, 30176 Marghera (VE) ·
        Tel: 041 5382830 · 041 3963095 ·
        <a href="https://www.zanonseafish.it/" target="_blank" rel="noopener">www.zanonseafish.it</a> ·
        <a href="mailto:info@zanonseafish.it">info@zanonseafish.it</a>
      </div>
    </div>
  </footer>

  <script>
  const PRODUCTS = [
    // ESEMPIO: scommenta e duplica per aggiungere articoli
     {id:"ID-UNICO", name:"Nome prodotto", price:7.20, oldPrice:8.00, unit:"€/kg", shortDesc:"Descrizione breve", images:["images/percorso-immagine.jpg"]}
  ];

  function fmtEUR(v){ return new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(v); }
  function sanitizeUnit(u){ if(!u) return ""; return u.replace('€','').trim()==="/kg" ? "/kg" : "€/kg"; }
  function discPercent(p){ if(!p.oldPrice || p.oldPrice<=0 || !p.price || p.price>=p.oldPrice) return 0; return Math.ceil(((p.oldPrice-p.price)/p.oldPrice)*100); }

  function starHTML(text){
    return '<div class="star-wrap"><div class="star"></div><div class="star-text">'+text+'</div></div>';
  }

  function rowTemplate(p){
    const unit = p.unit ? sanitizeUnit(p.unit) : (p.unit===""? "" : "");
    const save  = (p.oldPrice && p.oldPrice>p.price) ? (p.oldPrice - p.price) : 0;
    const perc  = discPercent(p);
    const label = perc>0 ? 'OFFERTA -'+perc+'%' : 'OFFERTA';
    return `
      <article class="item" onclick='openModal(${JSON.stringify(p).replace(/"/g,"&quot;")})' id="${p.id}">
        <div class="thumb">
          ${starHTML(label)}
          <img loading="lazy" src="${(p.images&&p.images[0])||'images/default1.jpg'}" alt="${p.name}" onerror="this.onerror=null;this.src='images/default1.jpg';">
        </div>
        <div>
          <h2 class="title">${p.name||""}</h2>
          <p class="desc">${p.shortDesc||""}</p>
          <div class="priceWrap">
            ${p.oldPrice?`<div class="old">${fmtEUR(p.oldPrice)}${unit}</div>`:""}
            <div class="price">${fmtEUR(p.price||0)}${unit}</div>
            <span class="unit">IVA escl.</span>
          </div>
          ${save>0?`<div class="save">RISPARMIO ${fmtEUR(save)}</div>`:""}
        </div>
      </article>`;
  }

  function render(list=PRODUCTS){
    const grid=document.getElementById("grid");
    grid.innerHTML = list.length ? list.map(rowTemplate).join("") :
      `<div style="grid-column:1/-1;background:#fff;border:1px dashed #bbb;border-radius:12px;padding:14px;font-size:13px;color:#555">
        Nessun articolo in offerta. Aggiungi una riga in <code>PRODUCTS</code> come da esempio.
      </div>`;
  }

  const modal=document.getElementById("modal");
  const mTitle=document.getElementById("mTitle");
  const mImg=document.getElementById("mImg");
  const mDesc=document.getElementById("mDesc");
  const mPrice=document.getElementById("mPrice");
  const starTextModal=document.getElementById("starTextModal");
  const shareBtn=document.getElementById("shareBtn");
  const closeBtn=document.getElementById("closeBtn");
  let current=null;

  function openModal(prod){
    current=prod;
    const unit = prod.unit ? (prod.unit.includes("/kg")?" /kg":" €/kg") : "";
    mTitle.textContent=prod.name||"";
    mImg.src=(prod.images&&prod.images[0])||"images/default1.jpg";
    mImg.alt=prod.name||"";
    const old = prod.oldPrice ? `<span class="old" style="text-decoration:line-through;margin-right:8px">${fmtEUR(prod.oldPrice)}${unit}</span>` : "";
    mDesc.textContent=prod.shortDesc||"";
    mPrice.innerHTML = `${old} <strong style="font-size:22px">${fmtEUR(prod.price||0)}${unit}</strong>`;

    const perc = discPercent(prod);
    starTextModal.textContent = perc>0 ? 'OFFERTA -'+perc+'%' : 'OFFERTA';

    modal.classList.add("open"); document.body.style.overflow="hidden";
  }
  function closeModal(){ modal.classList.remove("open"); document.body.style.overflow=""; }
  closeBtn.onclick=closeModal;
  modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
  window.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
  shareBtn.onclick=async ()=>{
    if(!current) return;
    const url = location.origin+location.pathname+"#"+encodeURIComponent(current.id||"");
    try{ if(navigator.share){ await navigator.share({title:current.name,text:url,url}); return; } }catch(e){}
    try{ await navigator.clipboard.writeText(url); }catch(e){}
  };

  render();
  </script>
</body>
</html>
