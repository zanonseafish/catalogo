<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catalogo Prodotti ZANON SEAFISH • Natale</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fbfbf8;--ink:#111;--muted:#606060;--line:#e7e4dc;
  --brand:#0a84ff;--ok:#0a6a2b
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

/* sfondi laterali, nascosti su mobile per evitare sovrapposizioni */
html::before,html::after{
  content:"";position:fixed;bottom:0;width:120px;height:40vh;background-repeat:no-repeat;background-size:contain;pointer-events:none;z-index:-3
}
html::before{left:0;background-image:url("images/latosx.png");background-position:left bottom}
html::after{right:0;background-image:url("images/latodx.png");background-position:right bottom}
@media (max-width: 560px){
  html::before,html::after{display:none}
}

/* layout */
.container{max-width:1200px;margin:0 auto;padding:18px 16px 120px}
.header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header .brand{display:flex;align-items:center;gap:12px}
.header .brand img{height:48px;width:auto}
.header h1{margin:0;font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(22px,4vw,36px)}
.header .season{color:var(--muted);font-weight:600}

/* strumenti */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
input[type="search"]{flex:1 1 260px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
button.icon{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer}

/* griglia prodotti */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.figure{position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#f1f1f1}
.figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.figure[data-empty="1"]::after{
  content:"";position:absolute;inset:0;background:
  linear-gradient(135deg,#f6f6f6, #eaeaea);
}
.card .name{font-weight:600}
.card .meta{font-size:0.9rem;color:var(--muted)}
.card .price{font-weight:700;color:var(--ok)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:1000}
.modal.open{display:flex}
.sheet{max-width:780px;width:100%;background:#fff;border-radius:16px;overflow:hidden}
.sheet .hero{width:100%;height:320px;object-fit:cover;background:#eee}
.sheet .body{padding:16px}
.sheet .title{font-family:"Playfair Display",serif;font-size:28px;margin:0 0 6px}
.sheet .row{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted)}
.sheet .price{font-weight:700;color:var(--ok)}
.sheet .cta{display:flex;gap:10px;margin-top:12px}
.sheet .cta a,.sheet .cta button{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;text-decoration:none;color:inherit}

/* footer */
.site-footer{margin-top:28px;padding:16px 0;color:var(--muted);border-top:1px solid var(--line);font-size:.95rem}

/* MENU in basso a sinistra, identico ai template */
.back{position:fixed;left:14px;bottom:14px;z-index:1200}
.back a{display:inline-flex;align-items:center;gap:6px;padding:10px 12px;border-radius:999px;background:var(--brand);color:#fff;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25);font-weight:600}
.back a:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media print{.back{display:none!important}}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="brand">
      <img src="images/logo-zanon.png" alt="Zanon Seafish" onerror="this.style.display='none'">
      <div>
        <h1>Catalogo Natale</h1>
        <div class="season">Selezione natalizia 2024</div>
      </div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Cerca prodotto, codice, categoria…" aria-label="Cerca">
      <button id="shareAll" class="icon" title="Condividi pagina" aria-label="Condividi pagina">Condividi</button>
    </div>
  </header>

  <section id="grid" class="grid" aria-live="polite"></section>

  <footer class="site-footer">
    Zanon Seafish Ingros SRL • Via dell’Industria 12 • P.IVA 01234567890
  </footer>
</div>

<!-- Modal -->
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet">
    <img id="mimg" class="hero" src="" alt="">
    <div class="body">
      <h2 id="modal-title" class="title"></h2>
      <div class="row">
        <div id="mcode"></div>
        <div id="mcat"></div>
        <div id="mprice" class="price"></div>
      </div>
      <p id="mdesc"></p>
      <div class="cta">
        <button id="mshare" type="button">Condividi prodotto</button>
        <a id="mclose" href="#" role="button">Chiudi</a>
      </div>
    </div>
  </div>
</div>

<!-- Pulsante MENU conforme ai template -->
<div class="back"><a href="index.html" title="Torna al menu">↩︎ Menu</a></div>

<script>
/* Utility: immagine fallback senza icone rotte */
function safeImg(src, alt){
  const wrap = document.createElement("div");
  wrap.className = "figure";
  const img = document.createElement("img");
  img.loading = "lazy";
  img.alt = alt || "";
  img.src = src || "";
  let ok = true;
  img.onerror = ()=>{ if(ok){ ok=false; wrap.dataset.empty="1"; img.remove(); } };
  wrap.appendChild(img);
  return wrap;
}

/* Dataset placeholder. Sostituisci percorsi con i tuoi reali. */
const PRODUCTS = [
  {id:"COD123", name:"Baccalà mantecato", cat:"Antipasti", price:"€ 12,90", img:"images/prod/baccala.jpg", desc:"Cremoso, pronto all’uso."},
  {id:"COD124", name:"Gamberi in tempura", cat:"Fritti",    price:"€ 14,50", img:"images/prod/tempura.jpg", desc:"Croccanti, 10 pezzi."},
  {id:"COD125", name:"Salmone affumicato", cat:"Affumicati",price:"€ 19,90", img:"images/prod/salmone.jpg", desc:"Selezione premium."},
  {id:"COD126", name:"Capesante gratinate",cat:"Forno",     price:"€ 16,00", img:"images/prod/capesante.jpg", desc:"Pronte in 12 minuti."}
];

const grid   = document.getElementById("grid");
const q      = document.getElementById("q");
const modal  = document.getElementById("modal");
const mimg   = document.getElementById("mimg");
const mcode  = document.getElementById("mcode");
const mcat   = document.getElementById("mcat");
const mprice = document.getElementById("mprice");
const mdesc  = document.getElementById("mdesc");
const mshare = document.getElementById("mshare");
const mclose = document.getElementById("mclose");

function card(p){
  const el = document.createElement("article");
  el.className = "card";
  el.appendChild(safeImg(p.img, p.name));
  const name = document.createElement("div"); name.className="name"; name.textContent=p.name; el.appendChild(name);
  const meta = document.createElement("div"); meta.className="meta"; meta.textContent = `${p.cat} • ${p.id}`; el.appendChild(meta);
  const price = document.createElement("div"); price.className="price"; price.textContent=p.price; el.appendChild(price);
  el.addEventListener("click",()=>openModal(p.id));
  return el;
}

function render(list=PRODUCTS){
  grid.innerHTML = "";
  list.forEach(p=>grid.appendChild(card(p)));
}

function openModal(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  mimg.src = p.img; mimg.alt = p.name;
  document.getElementById("modal-title").textContent = p.name;
  mcode.textContent = p.id; mcat.textContent = p.cat; mprice.textContent = p.price; mdesc.textContent = p.desc || "";
  modal.classList.add("open"); history.replaceState(null,"","#"+id);
}

function closeModal(){ modal.classList.remove("open"); history.replaceState(null,"",location.pathname+location.search); }

async function shareProduct(p){
  const text = `${p.name} • ${p.price} • Codice ${p.id}`;
  try{
    if(navigator.share){ await navigator.share({title:p.name,text}); }
    else if(navigator.clipboard){ await navigator.clipboard.writeText(text); alert("Copiato negli appunti."); }
  }catch(e){}
}

q.addEventListener("input",()=>{
  const s = q.value.trim().toLowerCase();
  if(!s){ render(); return; }
  const parts = s.split(/\s+/).filter(Boolean);
  const out = PRODUCTS.filter(p=>{
    const hay = `${p.name}|${p.cat}|${p.id}|${(p.desc||"")}`.toLowerCase();
    return parts.every(t=>hay.includes(t));
  });
  render(out);
});

mshare.addEventListener("click",()=>{
  const id = location.hash.slice(1);
  const p = PRODUCTS.find(x=>x.id===id);
  if(p) shareProduct(p);
});
mclose.addEventListener("click",(e)=>{e.preventDefault();closeModal();});
modal.addEventListener("click",(e)=>{ if(e.target===modal) closeModal(); });
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeModal(); });

render();
(function(){ const h = decodeURIComponent(location.hash.slice(1)); if(!h) return; const p = PRODUCTS.find(x=>x.id===h); if(p) openModal(p.id); })();
</script>
</body>
</html>
