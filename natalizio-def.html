<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catalogo Prodotti ZANON SEAFISH • Natale</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfbf8;--ink:#111;--muted:#606060;--line:#e7e4dc;--brand:#0a6a2b;--price:#0a6a2b}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

/* Pesci laterali (schermo) */
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:120px;background-image:url("images/logo-zanon-pesce-natale.png");background-repeat:repeat-y;background-size:60% auto;pointer-events:none;z-index:-3}
body::before{left:1.2mm;background-position:left top}
body::after{right:1.2mm;background-position:right top}

/* Alberi dietro ai pesci (schermo) */
html::before,html::after{content:"";position:fixed;bottom:0;width:120px;height:50vh;background-repeat:no-repeat;background-size:contain;pointer-events:none;z-index:-4}
html::before{left:1.2mm;background-image:url("images/latosx.png");background-position:left bottom}
html::after{right:1.2mm;background-image:url("images/latodx.png");background-position:right bottom}

/* Header con gradiente verso i prodotti */
header{position:relative;color:#fff;text-align:center;padding:20px 12px 18px}
header::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,#8b0000 0%,#b30000 80%,transparent 100%);z-index:-1}
header .top{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
header img.logo{height:60px;width:auto;display:block}
header h1{font-family:"Playfair Display",serif;font-weight:600;letter-spacing:.02em;margin:0 0 2px 0;font-size:24px;line-height:1.15}
header .sub{opacity:.85;font-size:11.5px;margin-top:0}

/* Cerca stile riferimento */
.tools{display:flex;justify-content:center;margin-top:8px}
.search{max-width:480px;width:100%}
.search input{width:100%;padding:10px;border-radius:999px;border:1px solid #ffffff40;background:#ffffff12;color:var(--brand);outline:none}
.search input::placeholder{color:rgba(11,85,0,.7)}
.count{color:var(--brand);margin-top:8px;font-size:12px}

/* Layout con margini laterali per pesci/alberi */
header,.container,.site-footer{padding-left:134px;padding-right:134px}
@media (max-width:900px){header,.container,.site-footer{padding-left:16px;padding-right:16px}}
.container{max-width:1100px;margin:6px auto 14px}

/* Card PRODOTTO identiche al definitivo */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:84px 1fr 86px;gap:14px;align-items:center;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
.item:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.06)}
.thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;background:#f1f1ed;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;padding-left:8px}
.title{font-family:"Playfair Display",serif;font-weight:700;font-size:18px;letter-spacing:.02em;margin:0 0 3px 0;text-transform:uppercase}
.desc{color:var(--muted);font-size:12px;line-height:1.3;margin:0 0 4px 0}
.divider{height:1px;background:var(--line);margin:3px 0}
.price{justify-self:end;align-self:end;color:var(--price);font-weight:700;font-size:16px}
@media (max-width:820px){.item{grid-template-columns:76px 1fr 76px}.thumb{width:76px;height:76px}.title{font-size:17px}.price{font-size:15px}}
@media (max-width:560px){.item{grid-template-columns:64px 1fr 72px}.thumb{width:64px;height:64px}.title{font-size:16px}.desc{font-size:11.5px}.price{font-size:14px}}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
.modal.open{display:flex}
.modal-content{background:#fff;border-radius:12px;max-width:860px;width:min(96vw,860px);padding:20px;position:relative;max-height:90vh;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.35);display:flex;flex-direction:column}
.m-title{font-family:"Playfair Display",serif;margin:0 0 10px 0}
.m-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0;color:#333}
.m-price{color:var(--price);font-weight:700}
#gallery{flex:1 1 auto;overflow:auto;display:grid;gap:12px;align-items:center;justify-items:center}
#gallery:has(img:nth-child(2)){grid-template-columns:1fr 1fr}
#gallery img{max-width:100%;height:auto;display:block;object-fit:contain;border-radius:8px;border:1px solid var(--line)}
.share-small,.close-btn{border:none;border-radius:18px;padding:8px 12px;font-size:.9rem;cursor:pointer}
.share-small{background:#111;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.close-btn{background:#eee;color:#111;box-shadow:0 2px 6px rgba(0,0,0,.15)}

/* Footer bianco sopra glow rosso */
.site-footer{max-width:1100px;margin:18px auto 24px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,0.4)}
.site-rule{border:none;height:1px;background:#e5e2da;margin:6px 0 10px}
.site-footer-inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.footer-logo{height:20px;width:auto}
.foot-text{flex:1;min-width:240px}
.foot-mail{font-size:12px;color:#fff;text-decoration:none}

/* Glow rosso dal basso */
.footer-glow{position:fixed;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to top,rgba(139,0,0,1) 0%,rgba(179,0,0,0.85) 60%,transparent 100%);pointer-events:none;z-index:-1}

/* Bottone MENU */
.back-btn{position:fixed;left:14px;bottom:14px;z-index:1500;background:rgba(255,255,255,0.75);color:#0a6a2b;font-size:13px;font-weight:600;padding:6px 10px;border-radius:20px;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.back-btn:hover{background:#0a6a2b;color:#fff}

/* Stampa: solo alberi/pesci, niente rosso */
.print-col{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before,body::after,html::before,html::after{display:none!important}
  .print-col{display:block;position:fixed;top:0;bottom:0;width:120px;pointer-events:none}
  .print-col.left{left:1.2mm;background:url("images/latosx.png") no-repeat left bottom / contain}
  .print-col.right{right:1.2mm;background:url("images/latodx.png") no-repeat right bottom / contain}
  header::before,.footer-glow,.back-btn{display:none!important}
  .site-footer{color:#000;text-shadow:none}
  .foot-mail{color:#000;text-decoration:underline}
}
</style>
</head>
<body>
<div class="print-col left" aria-hidden="true"></div>
<div class="print-col right" aria-hidden="true"></div>

<header>
  <div class="top">
    <img class="logo" src="images/zanonlogonatale.png" alt="Zanon Seafish Ingros SRL" onerror="this.onerror=null;this.src='images/default1.jpg';">
    <h1>Catalogo Prodotti ZANON SEAFISH</h1>
    <div class="sub">Clicca un elemento per i dettagli e la condivisione.</div>
    <div class="tools"><div class="search"><input id="searchBox" placeholder="Cerca prodotti…"></div></div>
    <div id="count" class="count"></div>
  </div>
</header>

<div class="container">
  <div id="list" class="list"></div>
</div>

<div id="modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content" aria-labelledby="mTitle">
    <h2 id="mTitle" class="m-title"></h2>
    <div class="m-meta"><span id="mShort"></span><span id="mPrice" class="m-price"></span></div>
    <div id="gallery"></div>
    <p id="mFull"></p>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px">
      <button id="shareBtn" class="share-small" title="Condividi" aria-label="Condividi">📤 Condividi</button>
      <button id="closeBtn" class="close-btn" aria-label="Chiudi">Chiudi</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <hr class="site-rule">
  <div class="site-footer-inner">
    <img src="images/logo.png" alt="Zanon Seafish Ingros SRL" class="footer-logo" onerror="this.style.display='none'">
    <div class="foot-text">
      <strong>Zanon Seafish Ingros SRL</strong> · P.IVA IT01654690278 ·
      S. Croce 491, 30135 Venezia (VE) ·
      Via Colombara 115/A, 30176 Marghera (VE) ·
      Tel: 041 5382830 · 041 3963095 ·
      <a href="https://www.zanonseafish.it/" target="_blank" rel="noopener">www.zanonseafish.it</a> ·
      <a href="mailto:info@zanonseafish.it" class="foot-mail">info@zanonseafish.it</a>
    </div>
  </div>
</footer>

<div class="footer-glow" aria-hidden="true"></div>
<a class="back-btn" href="index2.html" title="Torna al menu">↩︎ Menu</a>

<script>
// === DATI ===
const PRODUCTS = [
  {id:"polpette-brasato",name:"Polpette di Brasato",price:14.00,shortDesc:"Conf. 2kg – Polpette di brasato surgelate (40 pz da 50g)",fullDesc:"Polpette di brasato dal gusto autentico, preparate con carne di manzo selezionata. Ideali per secondi o buffet caldi.",images:["img2/polpette-brasato.jpg"]},
  {id:"polpette-baccala",name:"Polpette di Baccalà",price:14.00,shortDesc:"Conf. 2kg – Polpette di baccalà surgelate (40 pz da 50g)",fullDesc:"Polpette morbide a base di baccalà e patate. Perfette fritte o al forno come antipasto di mare.",images:["img2/polpette-baccala.jpg"]},
  {id:"polpette-tonno-cipolla",name:"Polpette di Tonno e Cipolla",price:14.00,shortDesc:"Conf. 2kg – Polpette di tonno e cipolla (40 pz da 50g)",fullDesc:"Polpette di tonno con cipolla dolce e spezie mediterranee. Croccanti e profumate.",images:["img2/polpette-tonno-cipolla.jpg"]},
  {id:"polpette-pollo-speck",name:"Polpette di Pollo e Speck",price:12.00,shortDesc:"Conf. 2kg – Polpette di pollo e speck (40 pz da 50g)",fullDesc:"Polpette dal sapore deciso con carne di pollo e speck affumicato. Ottime per aperitivi o secondi piatti.",images:["img2/polpette-pollo-speck.jpg"]},
  {id:"polpette-verdure",name:"Polpette di Verdure",price:12.00,shortDesc:"Conf. 2kg – Polpette di verdure miste (40 pz da 50g)",fullDesc:"Polpette vegetariane con verdure fresche selezionate. Leggere e gustose, ideali per contorni o buffet.",images:["img2/polpette-verdure.png"]},
  {id:"arancini-mozzarella-prosciutto",name:"Arancini con Mozzarella e Prosciutto Prefritti",price:5.50,shortDesc:"Conf. 3kg – Arancini con mozzarella e prosciutto prefritti",fullDesc:"Arancini di riso con cuore di mozzarella e prosciutto cotto. Pronti per la cottura.",images:["img2/arancini-prosciutto.png"]},
  {id:"arancini-spinaci",name:"Arancini agli Spinaci Prefritti",price:5.50,shortDesc:"Conf. 3kg – Arancini agli spinaci prefritti",fullDesc:"Arancini di riso con ripieno cremoso agli spinaci e formaggio. Croccanti e saporiti.",images:["img2/arancini-spinaci.png"]},
  {id:"arrosticini-mare",name:"Arrosticini di Mare Panati (Totano Gigas)",price:8.30,shortDesc:"Conf. 4kg – Arrosticini di mare panati",fullDesc:"Spiedini di totano gigas impanati e croccanti. Ideali fritti o al forno.",images:["img2/arrosticini-pesce-panati.png"]},
  {id:"alici-panato",name:"Alici Panate Croccanti",price:8.90,shortDesc:"Conf. 1kg – Alici panate croccanti",fullDesc:"Filetti di alici panati e dorati. Ottimi per antipasti o secondi di mare.",images:["img2/alici-panati-croccanti.png"]},
  {id:"filetto-baccala-prezzemolo",name:"Filetto di Baccalà Pastellato con Prezzemolo",price:11.90,shortDesc:"Conf. 5x1kg – Filetti di baccalà pastellati con prezzemolo",fullDesc:"Filetti di baccalà teneri in pastella aromatica al prezzemolo. Croccanti e profumati.",images:["img2/filetti-baccala-pastellati.png"]},
  {id:"chele-granchio",name:"Chele di Granchio Panate",price:5.50,shortDesc:"Conf. 4x1kg – Chele di granchio panate",fullDesc:"Chele di surimi al gusto di granchio, con panatura dorata e croccante. Pronte in pochi minuti.",images:["img2/chele-granchio-panate.jpg"]},
  {id:"fiori-zucca-mozzarella-alici",name:"Fiori di Zucca con Mozzarella e Alici Prefritti",price:9.30,shortDesc:"Conf. 5x1kg – Fiori di zucca con mozzarella e alici",fullDesc:"Fiori di zucca ripieni di mozzarella e alici. Croccanti e saporiti, già pronti da rigenerare.",images:["img2/fiori-zucca-mozz-alici.png"]},
  {id:"fiori-zucca-prosciutto-mozzarella",name:"Fiori di Zucca con Prosciutto e Mozzarella Prefritti",price:8.10,shortDesc:"Conf. 5x1kg – Fiori di zucca con prosciutto e mozzarella",fullDesc:"Fiori di zucca con farcitura di prosciutto cotto e mozzarella filante. Doratura perfetta.",images:["img2/fiori-zucca-mozz-prosciutto.png"]},
  {id:"frittelle-gamberi-zucchine",name:"Frittelle di Gamberi e Zucchine",price:11.50,shortDesc:"Conf. 4x1kg – Frittelle di gamberi e zucchine",fullDesc:"Frittelle di gamberi e zucchine in pastella croccante. Pronte in pochi minuti.",images:["img2/frittelle-gamberi-zucchine.png"]},
  {id:"gamberi-patata",name:"Gamberi Avvolti in Filo di Patata",price:14.00,shortDesc:"Conf. 5x1kg – Gamberi avvolti in filo di patata",fullDesc:"Gamberi croccanti rivestiti di julienne di patata. Specialità gourmet.",images:["img2/gamberi-patata.jpg"]},
  {id:"mozzarelline-tartufo",name:"Mozzarelline Panate con Tartufo Prefritte",price:7.80,shortDesc:"Conf. 5x1kg – Mozzarelline con tartufo prefritte",fullDesc:"Mozzarelline filanti aromatizzate al tartufo. Perfette per aperitivi.",images:["img2/mozzarelline-tartufo.png"]},
  {id:"olive-ascolane",name:"Olive Ascolane",price:5.40,shortDesc:"Conf. 4x2,500kg – Olive ascolane ripiene di carne",fullDesc:"Olive verdi farcite con carne e panate. Croccanti e dorate in pochi minuti.",images:["img2/olive-ripiene-ascolana.png"]},
  {id:"olive-ascolane-prefritte",name:"Olive Ascolane Prefritte",price:5.90,shortDesc:"Conf. 5x1kg – Olive ascolane prefritte",fullDesc:"Versione prefritta delle classiche olive ascolane, pronte da rigenerare in forno o friggitrice.",images:["img2/olive-ripiene-ascolana.png"]},
  {id:"panzerotti-mozzarella",name:"Panzerotti Mozzarella e Pomodoro Prefritti",price:5.40,shortDesc:"Conf. 5x1kg – Panzerotti con mozzarella e pomodoro",fullDesc:"Mini panzerotti con ripieno di pomodoro e mozzarella filante. Perfetti come finger food.",images:["img2/panzerotti-mozzarella.png"]},
  {id:"polpette-melanzane",name:"Polpette di Melanzane, Mozzarella e Provola Affumicata",price:5.50,shortDesc:"Conf. 5x1kg – Polpette di melanzane con mozzarella e provola affumicata",fullDesc:"Polpette vegetariane dal sapore intenso e consistenza morbida. Perfette per aperitivi e buffet.",images:["img2/polpette-melanzane.png"]},
  {id:"salvia-pastellata",name:"Salvia Pastellata Prefritta",price:11.50,shortDesc:"Conf. 4x1kg – Foglie di salvia pastellate prefritte",fullDesc:"Foglie di salvia immerse in pastella leggera e croccante. Profumate e aromatiche.",images:["img2/salvia-pastellata.png"]},
  {id:"tris-verdure",name:"Tris di Verdure Pastellate Prefritte",price:5.20,shortDesc:"Conf. 5x1kg – Tris di verdure pastellate prefritte",fullDesc:"Mix croccante di zucchine, carote e peperoni in pastella dorata. Perfette per contorni o antipasti.",images:["img2/tris-verdure.png"]}
];

const list=document.getElementById('list');
const count=document.getElementById('count');
const fmt=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});

function row(p){
  return `<div class='item' data-id='${p.id}'>
    <div class='thumb'><img loading='lazy' src='${(p.images&&p.images[0])||"images/default1.jpg"}' alt='${p.name}' onerror="this.onerror=null;this.src='images/default1.jpg';"></div>
    <div class='info'><h3 class='title'>${p.name}</h3><p class='desc'>${p.shortDesc||""}</p><div class='divider'></div></div>
    <div class='price'>${fmt.format(p.price||0)}${p.unit||""}</div>
  </div>`
}

function render(arr){
  list.innerHTML=arr.map(row).join('');
  count.textContent=`${arr.length} ${arr.length===1?'prodotto':'prodotti'}`;
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>openModal(el.dataset.id));
}
render(PRODUCTS);

/* Modal */
const modal=document.getElementById('modal'),
      mTitle=document.getElementById('mTitle'),
      mShort=document.getElementById('mShort'),
      mFull=document.getElementById('mFull'),
      mPrice=document.getElementById('mPrice'),
      gallery=document.getElementById('gallery'),
      closeBtn=document.getElementById('closeBtn'),
      shareBtn=document.getElementById('shareBtn');
let currentId=null;

function galleryHTML(imgs,alt){
  const a=(imgs&&imgs.length?imgs:["images/default1.jpg"]).slice(0,2);
  return a.map(s=>`<img loading='lazy' src='${s||"images/default1.jpg"}' alt='${alt||""}' onerror="this.onerror=null;this.src='images/default1.jpg';">`).join('')
}

function openModal(id){
  const p=PRODUCTS.find(x=>x.id===id); if(!p) return;
  currentId=id;
  mTitle.textContent=p.name||"";
  mShort.textContent=p.shortDesc||"";
  mFull.textContent=p.fullDesc||"";
  mPrice.textContent=fmt.format(p.price||0)+(p.unit||"");
  gallery.innerHTML=galleryHTML(p.images,p.name);
  modal.classList.add('open');
  document.body.style.overflow='hidden';
  if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
}

function closeModal(){
  modal.classList.remove('open');
  document.body.style.overflow='';
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
}
closeBtn.onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

shareBtn.onclick=async()=>{
  const p=PRODUCTS.find(x=>x.id===currentId); if(!p) return;
  const t=`${p.name} – ${fmt.format(p.price)}\n${p.shortDesc||""}\n${location.origin+location.pathname}#${encodeURIComponent(p.id)}`;
  try{ if(navigator.share){ await navigator.share({title:p.name,text:t}); }
       else { await navigator.clipboard.writeText(t); alert('Dettagli copiati'); } }
  catch(e){}
};

document.getElementById('searchBox').addEventListener('input',e=>{
  const v=e.target.value.trim().toLowerCase();
  render(PRODUCTS.filter(p=>[p.name,p.shortDesc,p.fullDesc].filter(Boolean).some(s=>s.toLowerCase().includes(v))));
});
</script>
</body>
</html>
