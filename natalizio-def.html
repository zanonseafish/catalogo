<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catalogo Prodotti ZANON SEAFISH • Natale</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfbf8;--ink:#111;--muted:#606060;--line:#e7e4dc;--brand:#0a6a2b;--price:#0a6a2b}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

/* Pesci laterali (schermo) */
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:120px;background-image:url("images/logo-zanon-pesce-natale.png");background-repeat:repeat-y;background-size:60% auto;pointer-events:none;z-index:-3}
body::before{left:1.2mm;background-position:left top}
body::after{right:1.2mm;background-position:right top}

/* Alberi dietro ai pesci (schermo) */
html::before,html::after{content:"";position:fixed;bottom:0;width:120px;height:50vh;background-repeat:no-repeat;background-size:contain;pointer-events:none;z-index:-4}
html::before{left:1.2mm;background-image:url("images/latosx.png");background-position:left bottom}
html::after{right:1.2mm;background-image:url("images/latodx.png");background-position:right bottom}

/* Header con gradiente verso i prodotti */
header{position:relative;color:#fff;text-align:center;padding:20px 12px 18px}
header::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,#8b0000 0%,#b30000 80%,transparent 100%);z-index:-1}
header .top{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
header img.logo{height:60px;width:auto;display:block}
header h1{font-family:"Playfair Display",serif;font-weight:600;letter-spacing:.02em;margin:0 0 2px 0;font-size:24px;line-height:1.15}
header .sub{opacity:.85;font-size:11.5px;margin-top:0}

/* Cerca stile riferimento */
.tools{display:flex;justify-content:center;margin-top:8px}
.search{max-width:480px;width:100%}
.search input{width:100%;padding:10px;border-radius:999px;border:1px solid #ffffff40;background:#ffffff12;color:var(--brand);outline:none}
.search input::placeholder{color:rgba(11,85,0,.7)}
.count{color:var(--brand);margin-top:8px;font-size:12px}

/* Layout con margini laterali per pesci/alberi */
header,.container,.site-footer{padding-left:134px;padding-right:134px}
@media (max-width:900px){header,.container,.site-footer{padding-left:16px;padding-right:16px}}
.container{max-width:1100px;margin:6px auto 14px}

/* Card PRODOTTO identiche al definitivo */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:84px 1fr 86px;gap:14px;align-items:center;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
.item:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.06)}
.thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;background:#f1f1ed;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;padding-left:8px}
.title{font-family:"Playfair Display",serif;font-weight:700;font-size:18px;letter-spacing:.02em;margin:0 0 3px 0;text-transform:uppercase}
.desc{color:var(--muted);font-size:12px;line-height:1.3;margin:0 0 4px 0}
.divider{height:1px;background:var(--line);margin:3px 0}
.price{justify-self:end;align-self:end;color:var(--price);font-weight:700;font-size:16px}
@media (max-width:820px){.item{grid-template-columns:76px 1fr 76px}.thumb{width:76px;height:76px}.title{font-size:17px}.price{font-size:15px}}
@media (max-width:560px){.item{grid-template-columns:64px 1fr 72px}.thumb{width:64px;height:64px}.title{font-size:16px}.desc{font-size:11.5px}.price{font-size:14px}}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
.modal.open{display:flex}
.modal-content{background:#fff;border-radius:12px;max-width:860px;width:min(96vw,860px);padding:20px;position:relative;max-height:90vh;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.35);display:flex;flex-direction:column}
.m-title{font-family:"Playfair Display",serif;margin:0 0 10px 0}
.m-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0;color:#333}
.m-price{color:var(--price);font-weight:700}
#gallery{flex:1 1 auto;overflow:auto;display:grid;gap:12px;align-items:center;justify-items:center}
#gallery:has(img:nth-child(2)){grid-template-columns:1fr 1fr}
#gallery img{max-width:100%;height:auto;display:block;object-fit:contain;border-radius:8px;border:1px solid var(--line)}
.share-small,.close-btn{border:none;border-radius:18px;padding:8px 12px;font-size:.9rem;cursor:pointer}
.share-small{background:#111;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.close-btn{background:#eee;color:#111;box-shadow:0 2px 6px rgba(0,0,0,.15)}

/* Footer bianco sopra glow rosso */
.site-footer{max-width:1100px;margin:18px auto 24px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,0.4)}
.site-rule{border:none;height:1px;background:#e5e2da;margin:6px 0 10px}
.site-footer-inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.footer-logo{height:20px;width:auto}
.foot-text{flex:1;min-width:240px}
.foot-mail{font-size:12px;color:#fff;text-decoration:none}

/* Glow rosso dal basso */
.footer-glow{position:fixed;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to top,rgba(139,0,0,1) 0%,rgba(179,0,0,0.85) 60%,transparent 100%);pointer-events:none;z-index:-1}

/* Bottone MENU */
.back-btn{position:fixed;left:14px;bottom:14px;z-index:1500;background:rgba(255,255,255,0.75);color:#0a6a2b;font-size:13px;font-weight:600;padding:6px 10px;border-radius:20px;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.back-btn:hover{background:#0a6a2b;color:#fff}

/* Stampa: alberi dietro, prodotti davanti */
.print-col{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* Nascondo decorazioni schermo */
  body::before,body::after,html::before,html::after{display:none!important}
  /* Strato alberi in stampa: dietro a tutto */
  .print-col{display:block;position:fixed;top:0;bottom:0;width:120px;pointer-events:none;z-index:-1}
  .print-col.left{left:1.2mm;background:url("images/latosx.png") no-repeat left bottom / contain}
  .print-col.right{right:1.2mm;background:url("images/latodx.png") no-repeat right bottom / contain}
  /* Contenuti in primo piano */
  body{position:relative;z-index:0}
  header,.container,.site-footer,.list,.item{position:relative;z-index:1}
  header::before,.footer-glow,.back-btn{display:none!important}
  .site-footer{color:#000;text-shadow:none}
  .foot-mail{color:#000;text-decoration:underline}
}
</style>
</head>

  // === I Baccalà in vaschetta ===
  {id:"baccala-mantecato-200",category:"I Baccalà in vaschetta",name:"Baccalà mantecato 200 g",price:4.80,unit:"/confezione",shortDesc:"Vaschetta 200 g.",fullDesc:"Classico baccalà mantecato in vaschetta da 200 g. Crema vellutata, pronta all’uso.",images:[""]},
  {id:"baccala-mantecato-1kg",category:"I Baccalà in vaschetta",name:"Baccalà mantecato 1 kg",price:20.50,unit:"/confezione",shortDesc:"Vaschetta 1 kg.",fullDesc:"Baccalà mantecato formato convenienza da 1 kg. Per ristorazione e buffet.",images:[""]},

  {id:"baccala-condito-1kg",category:"I Baccalà in vaschetta",name:"Baccalà condito 1 kg",price:32.00,unit:"/confezione",shortDesc:"Vaschetta 1 kg.",fullDesc:"Baccalà condito formato 1 kg. Pronto da rigenerare e servire.",images:[""]},
  {id:"baccala-umido-150",category:"I Baccalà in vaschetta",name:"Baccalà in umido 150 g",price:5.50,unit:"/confezione",shortDesc:"Vaschetta 150 g.",fullDesc:"Baccalà in umido porzione singola da 150 g. Sugo ricco.",images:[""]},
  {id:"baccala-umido-1kg",category:"I Baccalà in vaschetta",name:"Baccalà in umido 1 kg",price:31.00,unit:"/confezione",shortDesc:"Vaschetta 1 kg.",fullDesc:"Baccalà in umido formato 1 kg. Resa elevata per cucina professionale.",images:[""]},

  {id:"dentice-mantecato-200",category:"Il Dentice mantecato",name:"Dentice mantecato 200 g",price:9.00,unit:"/confezione",shortDesc:"Vaschetta 200 g.",fullDesc:"Crema di dentice mantecato in vaschetta da 200 g. Sapore fine.",images:[""]},
  {id:"dentice-mantecato-500",category:"Il Dentice mantecato",name:"Dentice mantecato 500 g",price:18.50,unit:"/confezione",shortDesc:"Vaschetta 500 g.",fullDesc:"Dentice mantecato formato 500 g. Consistenza spalmabile.",images:[""]},

  // === Il Saor di Gamberi e Sarde ===
  {id:"gamberi-in-saor-200",category:"Il Saor di Gamberi e Sarde",name:"Gamberi in saor 200 g",price:6.00,unit:"/confezione",shortDesc:"Vaschetta 200 g.",fullDesc:"Gamberi in saor alla veneziana in vaschetta da 200 g.",images:[""]},

  {id:"sarde-in-saor-800",category:"Il Saor di Gamberi e Sarde",name:"Sarde in saor 800 g",price:13.50,unit:"/confezione",shortDesc:"Con uvetta e pinoli, vaschetta 800 g.",fullDesc:"Sarde in saor con uvetta e pinoli in vaschetta da 800 g. Ricetta tipica veneziana.",images:[""]},

  // === Altre specialità ===
  {id:"polpa-riccio-70",category:"Altre specialità",name:"Polpa di riccio 70 g",price:12.50,unit:"/confezione",shortDesc:"Marca Smeralda, vaso 70 g.",fullDesc:"Polpa di riccio di mare Smeralda in vasetto da 70 g. Intensa e sapida.",images:[""]},
  {id:"polpa-granchio-170",category:"Altre specialità",name:"Polpa di granchio 170 g",price:10.00,unit:"/confezione",shortDesc:"Marca Smeralda, 170 g.",fullDesc:"Polpa di granchio Smeralda da 170 g. Pronta per insalate e sushi-roll.",images:[""]},

  {id:"alici-marinate-200",category:"Altre specialità",name:"Alici marinate 200 g",price:3.00,unit:"/confezione",shortDesc:"Vaschetta 200 g.",fullDesc:"Filetti di alici marinate in vaschetta da 200 g. Fresche e pronte.",images:[""]},

  {id:"alici-sicilia-evo-720",category:"Altre specialità",name:"Alici Sicilia EVO 720 g",price:14.50,unit:"/confezione",shortDesc:"Filetti in vaso vetro 720 g.",fullDesc:"Filetti di alici Sicilia in olio extra vergine, vaso vetro da 720 g.",images:[""]},
  {id:"tonno-vaso-180",category:"Altre specialità",name:"Filetti di tonno in olio 180 g",price:7.00,unit:"/confezione",shortDesc:"Vaso vetro 180 g.",fullDesc:"Filetti di tonno in olio di oliva in vaso di vetro da 180 g.",images:[""]},
  {id:"tonno-latta-850",category:"Altre specialità",name:"Filetti di tonno in olio 850 g",price:20.00,unit:"/confezione",shortDesc:"Latta richiudibile 850 g.",fullDesc:"Filetti di tonno in olio di oliva, latta richiudibile da 850 g.",images:[""]},
  {id:"stoccafisso-secco-kg",category:"Altre specialità",name:"Stoccafisso secco sottovuoto",price:56.00,unit:"/kg",shortDesc:"Confezionato sottovuoto, vendita a peso.",fullDesc:"Stoccafisso secco confezionato sottovuoto. Prezzo al kg.",images:[""]}
];

const list=document.getElementById('list');
const count=document.getElementById('count');
const fmt=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});

function row(p){
  return `<div class='item' data-id='${p.id}'>
    <div class='thumb'><img loading='lazy' src='${(p.images&&p.images[0])||"images/default1.jpg"}' alt='${p.name}' onerror="this.onerror=null;this.src='images/default1.jpg';"></div>
    <div class='info'><h3 class='title'>${p.name}</h3><p class='desc'>${p.shortDesc||""}</p><div class='divider'></div></div>
    <div class='price'>${fmt.format(p.price||0)}${p.unit||""}</div>
  </div>`
}

function render(arr){
  list.innerHTML=arr.map(row).join('');
  count.textContent=`${arr.length} ${arr.length===1?'prodotto':'prodotti'}`;
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>openModal(el.dataset.id));
}
render(PRODUCTS);

/* Modal */
const modal=document.getElementById('modal'),
      mTitle=document.getElementById('mTitle'),
      mShort=document.getElementById('mShort'),
      mFull=document.getElementById('mFull'),
      mPrice=document.getElementById('mPrice'),
      gallery=document.getElementById('gallery'),
      closeBtn=document.getElementById('closeBtn'),
      shareBtn=document.getElementById('shareBtn');
let currentId=null;

function galleryHTML(imgs,alt){
  const a=(imgs&&imgs.length?imgs:["images/default1.jpg"]).slice(0,2);
  return a.map(s=>`<img loading='lazy' src='${s||"images/default1.jpg"}' alt='${alt||""}' onerror="this.onerror=null;this.src='images/default1.jpg';">`).join('')
}

function openModal(id){
  const p=PRODUCTS.find(x=>x.id===id); if(!p) return;
  currentId=id;
  mTitle.textContent=p.name||"";
  mShort.textContent=p.shortDesc||"";
  mFull.textContent=p.fullDesc||"";
  mPrice.textContent=fmt.format(p.price||0)+(p.unit||"");
  gallery.innerHTML=galleryHTML(p.images,p.name);
  modal.classList.add('open');
  document.body.style.overflow='hidden';
  if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
}

function closeModal(){
  modal.classList.remove('open');
  document.body.style.overflow='';
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
}
closeBtn.onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

shareBtn.onclick=async()=>{
  const p=PRODUCTS.find(x=>x.id===currentId); if(!p) return;
  const t=`${p.name} – ${fmt.format(p.price)}\n${p.shortDesc||""}\n${location.origin+location.pathname}#${encodeURIComponent(p.id)}`;
  try{ if(navigator.share){ await navigator.share({title:p.name,text:t}); }
       else { await navigator.clipboard.writeText(t); alert('Dettagli copiati'); } }
  catch(e){}
};

document.getElementById('searchBox').addEventListener('input',e=>{
  const v=e.target.value.trim().toLowerCase();
  render(PRODUCTS.filter(p=>[p.name,p.shortDesc,p.fullDesc].filter(Boolean).some(s=>s.toLowerCase().includes(v))));
});
</script>
</body>
</html>
