<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalogo • Template Modulare</title>
  <meta property="og:title" content="Catalogo • Template Modulare">
  <meta property="og:type" content="website">

  <!-- asset comuni pubblicati in /catalogo/sito/ -->
  <link rel="stylesheet" href="https://zanonseafish.github.io/catalogo/sito/styles.css?v=1">
  <script defer src="https://zanonseafish.github.io/catalogo/sito/app.js?v=1"></script>
</head>
<body>
  <!-- Header, Modal, Footer, PrintFooter e Menu verranno iniettati sotto -->
  <main class="container">
    <section class="grid" id="grid"></section>
  </main>

  <!-- Dataset prodotti: modifica solo questo array -->
  <script>
  const PRODUCTS = [
    {id:"polpette-brasato",name:"Polpette di Brasato",price:14.00,shortDesc:"Conf. 2kg – Polpette di brasato surgelate (40 pz da 50g)",fullDesc:"Polpette di brasato dal gusto autentico, preparate con carne di manzo selezionata. Ideali per secondi o buffet caldi.",images:["../img2/polpette-brasato.jpg"]},
  ];
  </script>

  <!-- Loader frammenti comuni con percorsi assoluti -->
  <script>
  (async () => {
    const BASE = "https://zanonseafish.github.io/catalogo/sito/";
    async function inject(url, where='body'){
      const html = await (await fetch(BASE + url, {cache:'no-store'})).text();
      document[where==='head'?'head':'body'].insertAdjacentHTML('beforeend', html);
    }
    try{
      await inject('header.html','body');
      await inject('menu.html','body');
      await inject('modal.html','body');
      if(!document.querySelector('.print-footer')) await inject('print-footer.html','body');
      await inject('footer.html','body');
    }catch(e){
      console.error('Errore caricamento frammenti:', e);
    }
    // Attendi che app.js definisca initCatalog, poi renderizza
    let tries=0;
    const max=40;
    const t = setInterval(()=>{
      if (window.initCatalog){
        clearInterval(t);
        try{ window.initCatalog(); }catch(err){ console.error('initCatalog error', err); }
      } else if (++tries>=max){ clearInterval(t); console.error('initCatalog non disponibile'); }
    }, 50);
  })();
  </script>
</body>
</html>
