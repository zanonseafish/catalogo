<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catalogo Prodotti ZANON SEAFISH — Natale (mask fix)</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ===== Variabili ===== */
:root{
  --ink:#111;
  --muted:#606060;
  --line:#e7e4dc;
  --price:#0a6a2b;
  /* Decorazione */
  --decor-w:110px;     /* larghezza colonna visiva */
  --decor-pad:8px;     /* rientro dall'orlo */
  --decor-img-w:84px;  /* larghezza immagine pesci */
  /* Maschera per non coprire i pesci con le card */
  --mask-left: calc(min(10vw, var(--decor-w)) - 10px + var(--decor-pad));
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:transparent;
  color:var(--ink);
  overflow-x:hidden;
}

/* ===== Decorazione laterale: pesci in loop, non altera layout ===== */
body::before{
  content:"";
  position:fixed;
  top:0; left:0; bottom:0;
  width:min(10vw,var(--decor-w));
  background:url("images/pesci-natalizi-colonna.png") left top repeat-y;
  background-position: var(--decor-pad) top;
  background-size: var(--decor-img-w) auto;
  pointer-events:none;
  z-index:0;
}

/* contenuti sopra la decorazione */
header, .container, .site-footer, .print-footer{ position:relative; z-index:1; }

@media (max-width:600px){
  :root{
    --decor-w:86px; --decor-pad:6px; --decor-img-w:68px;
    --mask-left: calc(min(10vw, 86px) - 10px + 6px);
  }
}
@media print{
  body::before{
    position:absolute !important;
    width: var(--decor-w) !important;
    background-position: var(--decor-pad) top !important;
    background-size: var(--decor-img-w) auto !important;
    background-repeat: repeat-y !important;
  }
}

/* ===== Header ===== */
header{
  background:linear-gradient(180deg,#0b1620 0%, #0e1f2a 60%, #0e1f2a00 100%);
  color:#fff;
  padding:20px 12px 18px;
  text-align:center
}
header .top{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
header img.logo{height:60px;width:auto;display:block;margin:0 auto}
header h1{font-family:"Playfair Display",serif;font-weight:600;letter-spacing:.02em;margin:0 0 2px 0;font-size:24px;line-height:1.15}
header .sub{opacity:.85;font-size:11.5px;margin-top:0}
.tools{display:flex;justify-content:center;margin-top:8px}
.search{max-width:480px;width:100%}
.search input{width:100%;padding:10px;border-radius:999px;border:1px solid #ffffff40;background:#ffffff12;color:#fff;outline:none}
.count{color:#67d47a;margin-top:8px;font-size:12px}

/* ===== Lista prodotti ===== */
.container{max-width:1100px;margin:6px auto 14px;padding:0 10px;background:transparent}
.list{display:flex;flex-direction:column;gap:10px}

/* Card rossa con MASCHERA a sinistra: non copre i pesci */
.item{
  display:grid;grid-template-columns:84px 1fr 86px;gap:14px;align-items:center;
  border-radius:10px;padding:8px 10px;border:1px solid rgba(186,24,27,0.22);
  box-shadow:0 1px 6px rgba(0,0,0,.05);
  cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
  background:
    linear-gradient(to right,
      rgba(186,24,27,0) 0,
      rgba(186,24,27,0) var(--mask-left),    /* fascia trasparente sopra i pesci */
      rgba(186,24,27,0.20) calc(var(--mask-left) + 1px),
      rgba(186,24,27,0.20) 100%);
  /* bordo leggero sopra la maschera per continuità */
  outline:1px solid rgba(186,24,27,0.22);
  outline-offset:-1px;
  background-clip:padding-box;
}
.item:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.06)}
.thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;background:rgba(241,241,237,.55);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;padding-left:8px}
.title{font-family:"Playfair Display",serif;font-weight:700;font-size:18px;letter-spacing:.02em;margin:0 0 3px 0;text-transform:uppercase}
.desc{color:var(--muted);font-size:12px;line-height:1.3;margin:0 0 4px 0}
.divider{height:1px;background:var(--line);margin:3px 0}
.price{justify-self:end;align-self:end;color:var(--price);font-weight:700;font-size:16px}

/* ===== Responsive ===== */
@media (max-width:820px){
  header{padding:16px 10px 16px}
  header h1{font-size:22px}
  .item{grid-template-columns:76px 1fr 74px}
  .thumb{width:76px;height:76px;border-radius:10px}
  .title{font-size:16px}
  .price{font-size:15px}
}
@media (max-width:560px){
  header{padding:14px 8px 14px}
  header h1{font-size:20px}
  .item{grid-template-columns:66px 1fr;grid-template-rows:auto auto;gap:8px}
  .price{grid-column:2;justify-self:end}
}

/* ===== Stampa ===== */
@media print{
  @page{size:A4;margin:14mm 12mm}
  header{background:none!important;color:#000!important;border-bottom:1px solid #ddd!important;padding:0 0 6mm}
  .sub,.tools,#count{display:none!important}
  .item{break-inside:avoid-page;page-break-inside:avoid;box-shadow:none;border-color:#ddd}
}

/* Pulsante menu */
.back-btn{
  position:fixed; bottom:14px; left:14px;
  background:rgba(255,255,255,0.75);
  color:#0a6a2b; font-size:13px; font-weight:600;
  padding:6px 10px; border-radius:20px; text-decoration:none;
  box-shadow:0 2px 6px rgba(0,0,0,0.15); z-index:1500;
  transition:background .15s ease, color .15s ease;
}
.back-btn:hover{ background:#0a6a2b; color:#fff; }
@media print{ .back-btn{ display:none!important; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <img class="logo" src="images/logo.png" alt="Zanon Seafish Ingros SRL" onerror="this.onerror=null;this.src='images/default1.jpg';">
    <h1>Catalogo Prodotti ZANON SEAFISH</h1>
    <div class="sub">Versione Natalizia — clicca un elemento per i dettagli.</div>
    <div class="tools"><div class="search"><input id="searchBox" placeholder="Cerca prodotti…"></div></div>
    <div id="count" class="count"></div>
  </div>
</header>

<div class="container">
  <div id="list" class="list"></div>
</div>

<!-- ===== SCRIPT ===== -->
<script>
/* === INCOLLA QUI LA LISTA PRODOTTI ================================
Sostituisci questa dichiarazione con il tuo `const PRODUCTS=[...]` completo.
Mantieni il nome costante: PRODUCTS.
------------------------------------------------------------------- */
const PRODUCTS = []; // incolla qui il tuo array
/* === FINE AREA INCOLLA ========================================== */

PRODUCTS.sort((a,b)=>a.id.localeCompare(b.id));
const listEl=document.getElementById("list");
const fmt=new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"});
const countEl=document.getElementById("count");
const q=document.getElementById("searchBox");

function rowTemplate(p){
  return `
  <div class="item">
    <div class="thumb"><img loading="lazy" src="${(p.images&&p.images[0])||'images/default1.jpg'}" alt="${p.name}" onerror="this.onerror=null;this.src='images/default1.jpg';"></div>
    <div class="info">
      <h3 class="title">${p.name}</h3>
      <p class="desc">${p.shortDesc||""}</p>
      <div class="divider"></div>
    </div>
    <div class="price">${fmt.format(p.price)}${p.unit||""}</div>
  </div>`;
}
function render(list=PRODUCTS){
  listEl.innerHTML = list.length ? list.map(rowTemplate).join("") : '<div class="item" style="min-height:70px;display:flex;align-items:center;justify-content:center;">Nessun risultato</div>';
  countEl.textContent = list.length===PRODUCTS.length ? `${list.length} prodotti` : `${list.length} risultati`;
}
q.addEventListener("input",()=>{
  const term=q.value.trim().toLowerCase();
  if(!term){render(PRODUCTS);return;}
  const res=PRODUCTS.filter(p=>{
    const hay=[p.name||"",p.shortDesc||"",p.fullDesc||"",...(p.images||[]).map(x=>x.split('/').pop()||"")].join(" ").toLowerCase();
    return hay.includes(term);
  });
  render(res);
});
render();
</script>

<a href="index2.html" title="Torna al menu" class="back-btn" aria-label="Torna al menu principale">↩︎ Menu</a>
</body>
</html>
