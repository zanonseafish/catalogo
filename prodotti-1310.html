<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalogo Prodotti ZANON SEAFISH - Natale</title>

  <meta property="og:title" content="Catalogo Prodotti ZANON SEAFISH - Natale">
  <meta property="og:description" content="Catalogo Prodotti Zanon Seafish Ingros SRL - versione natalizia">
  <meta property="og:url" content="https://zanonseafish.github.io/catalogo/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://zanonseafish.github.io/catalogo/images/og-cover1.jpg">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#fbfbf8;
      --ink:#111;
      --muted:#606060;
      --line:#e7e4dc;
      --brand:#0b5;
      --price:#0a6a2b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}

    /* Decorazione natalizia sinistra */
    :root{
      --decor-w:110px;
      --decor-pad:8px;
      --decor-img-w:84px;
    }

    body::before{
      content:"";
      position:fixed;
      top:0; left:0; bottom:0;
      width:min(10vw,var(--decor-w));
      background:url("images/pesci-natalizi-colonna.png") left top repeat-y;
      background-position:var(--decor-pad) top;
      background-size:var(--decor-img-w) auto;
      pointer-events:none;
      z-index:0;
      opacity:.9;
    }

    @media (max-width:600px){
      :root{--decor-w:86px;--decor-pad:6px;--decor-img-w:68px;}
    }
    @media print{
      body::before{
        position:absolute!important;
        width:var(--decor-w)!important;
        background-position:var(--decor-pad) top!important;
        background-size:var(--decor-img-w) auto!important;
        background-repeat:repeat-y!important;
      }
    }
    header,.container,.site-footer,.print-footer{position:relative;z-index:1}

    /* Card natalizia */
    .item{
      background:linear-gradient(to right,rgba(186,24,27,0.08),rgba(255,255,255,0.72));
      border:1px solid rgba(231,228,220,0.75);
      box-shadow:0 1px 6px rgba(0,0,0,.05);
    }
    .thumb{background:rgba(241,241,237,.75)}

    /* Header */
    header{background:linear-gradient(180deg,#0b1620 0%,#0e1f2a 60%,#0e1f2a00 100%);color:#fff;padding:20px 12px 18px;text-align:center;position:relative}
    header .top{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
    header img.logo{height:60px;width:auto;display:block;margin:0 auto}
    header h1{font-family:"Playfair Display",serif;font-weight:600;margin:0;font-size:24px;line-height:1.15}
    header .sub{opacity:.85;font-size:11.5px;margin-top:0}
    .tools{display:flex;justify-content:center;margin-top:8px}
    .search{max-width:480px;width:100%}
    .search input{width:100%;padding:10px;border-radius:999px;border:1px solid #ffffff40;background:#ffffff12;color:var(--brand);outline:none}
    .count{color:var(--brand);margin-top:8px;font-size:12px}
    .container{max-width:1100px;margin:6px auto 14px;padding:0 10px}
    .list{display:flex;flex-direction:column;gap:10px}
    .item{display:grid;grid-template-columns:84px 1fr 86px;gap:14px;align-items:center;border-radius:10px;padding:8px 10px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
    .item:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.06)}
    .thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .info{min-width:0;padding-left:8px}
    .title{font-family:"Playfair Display",serif;font-weight:700;font-size:18px;margin:0 0 3px 0;text-transform:uppercase}
    .desc{color:var(--muted);font-size:12px;line-height:1.3;margin:0 0 4px 0}
    .divider{height:1px;background:var(--line);margin:3px 0}
    .price{justify-self:end;align-self:end;color:var(--price);font-weight:700;font-size:16px}

  </style>
</head>
<body>
  <header>
    <div class="top">
      <img class="logo" src="images/logo.png" alt="Zanon Seafish Ingros SRL">
      <h1>Catalogo Prodotti ZANON SEAFISH</h1>
      <div class="sub">Versione Natalizia</div>
      <div class="tools"><div class="search"><input id="searchBox" placeholder="Cerca prodotti…"></div></div>
      <div id="count" class="count"></div>
    </div>
  </header>

  <div class="container">
    <div id="list" class="list"></div>
  </div>

  <!-- commento: incolla qui la lista PRODUCTS tra i due tag sotto -->
  <script>
  /* dati prodotti da qui ------------------------------------------------------------------------------ */

  /* a qui dati prodotti ------------------------------------------------------------------------------ */
  </script>

</body>
</html>
