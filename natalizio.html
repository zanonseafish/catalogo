<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catalogo Prodotti ZANON SEAFISH • Natale</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfbf8;--ink:#111;--muted:#606060;--line:#e7e4dc;--ok:#0a6a2b;--brand:#0a6a2b}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

/* Pesci laterali dietro ai contenuti */
body::before,body::after{
  content:"";position:fixed;top:0;bottom:0;width:120px;
  background-image:url("images/logo-zanon-pesce-natale.png");
  background-repeat:repeat-y;background-size:60% auto;
  pointer-events:none;z-index:-3}
body::before{left:1.2mm;background-position:left top}
body::after{right:1.2mm;background-position:right top}

/* Alberi laterali ancora più indietro */
html::before,html::after{
  content:"";position:fixed;bottom:0;width:120px;height:50vh;
  background-repeat:no-repeat;background-size:contain;
  pointer-events:none;z-index:-4}
html::before{left:1.2mm;background-image:url("images/latosx.png");background-position:left bottom}
html::after{right:1.2mm;background-image:url("images/latodx.png");background-position:right bottom}

/* Header con gradiente solo verso i prodotti */
header{position:relative;color:#fff;text-align:center;padding:20px 12px 18px}
header::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,#8b0000 0%,#b30000 80%,transparent 100%);
  z-index:-1}
header .top{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
header img.logo{height:60px;width:auto}
header h1{font-family:"Playfair Display",serif;font-weight:600;margin:0 0 2px 0;font-size:24px;line-height:1.15}
header .sub{opacity:.9;font-size:12px}

/* Ricerca stile riferimento */
.tools{display:flex;justify-content:center;margin-top:8px}
.search{max-width:480px;width:100%}
.search input{
  width:100%;padding:10px;border-radius:999px;
  border:1px solid #ffffff40;background:#ffffff12;
  color:var(--brand);appearance:none;-webkit-appearance:none;
}
.search input::placeholder{color:rgba(11,85,0,.7)}
.count{color:#fff;margin-top:8px;font-size:12px}

/* Layout */
header,.container,.site-footer{padding-left:134px;padding-right:134px}
@media (max-width:900px){header,.container,.site-footer{padding-left:16px;padding-right:16px}}
.container{max-width:1100px;margin:6px auto 14px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:84px 1fr 86px;gap:14px;align-items:center;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer}
.thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;background:#f1f1ed;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0}
.title{font-family:"Playfair Display",serif;font-weight:700;font-size:18px;margin:0 0 3px 0;text-transform:uppercase}
.desc{color:var(--muted);font-size:12px;margin:0 0 4px 0}
.divider{height:1px;background:var(--line);margin:3px 0}
.price{justify-self:end;align-self:end;color:var(--ok);font-weight:700;font-size:16px}

/* Footer migliorato, rosso solo verso l’alto */
.site-footer{max-width:1100px;margin:18px auto 24px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,0.4)}
.site-rule{border:none;height:1px;background:#e5e2da;margin:6px 0 10px}
.footer-glow{
  position:fixed;left:0;right:0;bottom:0;height:120px;
  background:linear-gradient(to top,rgba(139,0,0,1) 0%,rgba(179,0,0,0.85) 60%,transparent 100%);
  pointer-events:none;z-index:-1}

/* Stampa: rosso disattivato, visibili solo pesci e alberi */
.print-col{display:none}
@media print{
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header::before,.footer-glow{display:none!important}
  .print-col{display:block;position:fixed;top:0;bottom:0;width:120px;z-index:-4;background-repeat:repeat-y;background-size:60% auto;pointer-events:none}
  .print-col.left{left:1.2mm;background-image:url("images/latosx.png")}
  .print-col.right{right:1.2mm;background-image:url("images/latodx.png")}
}
</style>
</head>
<body>
<div class="print-col left" aria-hidden="true"></div>
<div class="print-col right" aria-hidden="true"></div>

<header>
  <div class="top">
    <img class="logo" src="images/zanonlogonatale.png" alt="Zanon Seafish Ingros SRL">
    <h1>Catalogo Prodotti ZANON SEAFISH</h1>
    <div class="sub">Clicca un elemento per i dettagli e la condivisione.</div>
    <div class="tools"><div class="search"><input id="searchBox" placeholder="Cerca prodotti…"></div></div>
    <div id="count" class="count"></div>
  </div>
</header>

<div class="container"><div id="list" class="list"></div></div>

<footer class="site-footer">
  <hr class="site-rule">
  <div>
    <strong>Zanon Seafish Ingros SRL</strong> · P.IVA IT01654690278 ·
    Via Colombara 115/A, 30176 Marghera (VE) · Tel: 041 5382830 · 041 3963095 ·
    <a href="https://www.zanonseafish.it/" target="_blank" rel="noopener">www.zanonseafish.it</a> ·
    <a href="mailto:info@zanonseafish.it">info@zanonseafish.it</a>
  </div>
</footer>

<div class="footer-glow" aria-hidden="true"></div>

<script>
const PRODUCTS=[
{id:"natale-01",name:"Capesante Gratinate",price:8.90,shortDesc:"Conf. 1kg – Capesante gratinate al forno"},
{id:"natale-02",name:"Gamberoni in Saor",price:14.50,shortDesc:"Conf. 1kg – Marinatura veneziana"},
{id:"natale-03",name:"Baccalà alla Vicentina",price:25.50,shortDesc:"Conf. 1kg – Ricetta tradizionale"},
{id:"natale-04",name:"Fritto Misto di Mare",price:13.20,shortDesc:"Conf. 1kg – Calamari, gamberi, alici"},
{id:"natale-05",name:"Salmone in Crosta",price:22.90,shortDesc:"Conf. 1kg – Filetto di salmone in crosta"}
];
const list=document.getElementById("list");
const fmt=new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"});
function row(p){return`<div class='item'><div class='thumb'><img src='images/default1.jpg' alt='${p.name}'></div><div class='info'><h3 class='title'>${p.name}</h3><p class='desc'>${p.shortDesc}</p><div class='divider'></div></div><div class='price'>${fmt.format(p.price)}</div></div>`}
list.innerHTML=PRODUCTS.map(row).join("");
</script>
</body>
</html>
